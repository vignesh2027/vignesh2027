<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 6" width="1200" height="6" preserveAspectRatio="none" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0b3d91"/>
      <stop offset="35%"  stop-color="#1565c0"/>
      <stop offset="50%"  stop-color="#39d353"/>
      <stop offset="65%"  stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#0b3d91"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0; -1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="2" width="1200" height="2" rx="1" fill="#21262d"/>
  <rect x="0" y="1.5" width="1200" height="3" rx="1.5" fill="url(#dg)"/>
</svg>
