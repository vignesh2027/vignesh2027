name: Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Monochrome to match the panels: white snake on greys, premium dark blue, matching the panels.
      - name: Generate snakes
        uses: Platane/snk@v3
        with:
          github_user_name: vignesh2027
          outputs: |
            dist/snake-navy.svg?color_snake=%234d8dff&color_dots=%2306080f,%231b2740,%232f4a7d,%234d8dff,%239dc0ff
            dist/snake-terminal.svg?color_snake=%239dc0ff&color_dots=%2306080f,%23142038,%23264069,%233f79e0,%23b3ceff

      - name: Push to snake-output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
