name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: vignesh2027
          outputs: |
            dist/snake-navy.svg?color_snake=%2358a6ff&color_dots=%230d1117,%230b2545,%2313395e,%231b5299,%231f6feb
            dist/snake-terminal.svg?color_snake=%23a5d6ff&color_dots=%2305070c,%230a2540,%23144272,%23205295,%232c74b3
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg

      - name: Push to snake-output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
