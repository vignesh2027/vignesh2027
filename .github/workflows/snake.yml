name: Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Monochrome to match the panels: white snake on greys, amber as the
      # single accent for the densest days.
      - name: Generate snakes
        uses: Platane/snk@v3
        with:
          github_user_name: vignesh2027
          outputs: |
            dist/snake-navy.svg?color_snake=%23ffffff&color_dots=%23000000,%231f2023,%233a3d42,%238b9096,%23f0b429
            dist/snake-terminal.svg?color_snake=%23f0b429&color_dots=%23000000,%231a1b1e,%2334373c,%23787d84,%23ffffff

      - name: Push to snake-output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
