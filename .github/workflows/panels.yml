name: Terminal Panels

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  # Deliberately NOT triggered on push: it regenerates the very files a push
  # just delivered, which collided with every manual push to main.

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The panels are generated here rather than fetched from a render
      # service, so the profile cannot be broken by someone else's quota.
      - name: Render panels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_panels.py

      - name: Commit if changed
        run: |
          git config user.name "vignesh2027"
          git config user.email "applemacbook6sep2004@gmail.com"
          git add assets/panel-*.svg
          if git diff --cached --quiet; then
            echo "panels unchanged"
            exit 0
          fi
          git commit -m "chore: refresh terminal panels"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          exit 1
