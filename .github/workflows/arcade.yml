name: Arcade Contribution Graphs

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate arcade SVGs
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: vignesh2027
          games: 'pacman,breakout,galaga,minesweeper'
          hide_month_labels: 'false'

      # NOTE: target_branch must NOT be `output` — that branch belongs to the
      # 3d-contrib workflow, and this action would replace its contents wholesale.
      - name: Push to arcade-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: arcade-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
